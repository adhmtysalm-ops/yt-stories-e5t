name: Update YouTube Stories

on:
  workflow_dispatch:
  repository_dispatch:
    types: [update_stories]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Fetch Script
        run: node fetch.js

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add stories.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update stories.json [skip ci]" && git push)
